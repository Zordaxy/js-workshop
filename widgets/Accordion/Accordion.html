<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      .content {
        display: none;
      }

      .active .content {
        display: block;
      }

      /* optional style to have nice */
      .accord-header {
        background-color: #eee;
        color: #444;
        cursor: pointer;
        padding: 18px;
        width: 100%;
        border: none;
        text-align: left;
        outline: none;
        font-size: 15px;
        transition: 0.4s;
      }

      .active,
      .accord-header:hover {
        background-color: #ccc;
      }

      .content {
        padding: 0 18px;
        display: none;
        background-color: white;
        overflow: hidden;
      }
    </style>
  </head>

  <body>
    <ul class="accordion">
      <li class="accordion-entry">
        <button class="accord-header">Accordeon entry 1</button>
        <div class="content">Lorem ipsum</div>
      </li>
      <li class="accordion-entry">
        <button class="accord-header">Accordeon entry 2</button>
        <div class="content">Lorem ipsum</div>
      </li>
      <li class="accordion-entry">
        <button class="accord-header">Accordeon entry 2</button>
        <div class="content">Lorem ipsum</div>
      </li>
    </ul>

    <script>
      const accordion = document.querySelector(".accordion");

      accordion.addEventListener("click", (event) => {
        const target = event.target;
        if (target.classList.contains("accord-header")) {
          target.parentNode.classList.toggle("active");

          // If we need close others
          const accEntries = document.querySelectorAll(".accordion-entry");
          accEntries.forEach((entry) => {
            if (entry !== target.parentNode) {
              entry.classList.remove("active");
            }
          });
        }
      });
    </script>
  </body>
</html>
